plugins {
	id "fabric-loom" version "1.7.2"
	id "maven-publish"
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "Ladysnake"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
}

dependencies {
	// Main
	minecraft("com.mojang:minecraft:${project.minecraft_version}")
	mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
	modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")

	// Fabric API (direct)
	modImplementation(fabricApi.module("fabric-api-base", project.fabric_version))
	modImplementation(fabricApi.module("fabric-command-api-v2", project.fabric_version))

	// Fabric API (helper)
	modImplementation(fabricApi.module("fabric-resource-loader-v0", project.fabric_version))
	modRuntimeOnly("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

	// Cardinal Components (Base)
	modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}")
	include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}")

	// Cardinal Components (Entity)
	modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}")
	include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}")

	// Placeholder API
	modImplementation("eu.pb4:placeholder-api:${project.placeholder_api_version}")

	// SGUI
	modImplementation("eu.pb4:sgui:${project.sgui_version}")
	include("eu.pb4:sgui:${project.sgui_version}")

	// Server Translations API
	modImplementation("xyz.nucleoid:server-translations-api:${project.server_translations_api_version}")
	include("xyz.nucleoid:server-translations-api:${project.server_translations_api_version}")

	// Permissions API
	modImplementation("me.lucko:fabric-permissions-api:${project.permissions_api_version}") {
		transitive = false
	}
	include("me.lucko:fabric-permissions-api:${project.permissions_api_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
	options.release = 17
	options.encoding = "UTF-8"
}

jar {
	from "LICENSE"
}